<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h2>Admin Panel</h2>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a routerLink="/dashboard">Dashboard</a></li>
        <li><a routerLink="/dashboard/product-management">Add Product</a></li>
        <li><a routerLink="/dashboard/show-products">Show Products</a></li>
        <li><a routerLink="/dashboard/show-categories">Show Categories</a></li>
        <li><a routerLink="/dashboard/settings">Settings</a></li>
        <li><button class="logout-btn" (click)="Logout()">Logout</button></li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="main-header">
      <h1>Admin Dashboard</h1>
      <div class="user-info">
        <p>Welcome, <strong>{{ email }}</strong>!</p>
        <p>Your role is: <strong>{{ role }}</strong></p>
      </div>
    </header>

    <section class="dashboard-stats">
      <div class="stat-card">
        <h3>Total Clients</h3>
        <p>{{ this.users.length }}</p>
      </div>
      <div class="stat-card">
        <h3>Total Products</h3>
        <p>{{ this.products.length }}</p>
      </div>
      <div class="stat-card">
        <h3>Total Categories</h3>
        <p>{{ this.category.length }}</p>
      </div>
    </section>
  </main>
</div>
