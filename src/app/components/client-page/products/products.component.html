<div class="products-container">
    <div class="product-card" *ngFor="let product of products">
      <img 
        class="product-image" 
        src="https://plus.unsplash.com/premium_photo-1682339458664-ca534cd881d5?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" 
        alt="{{ product.name }}" />
      <div class="product-details">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <p class="product-price">${{ product.price }}</p>
        <!-- If you want to show the category id -->
        <p class="product-category">Category ID: {{ product.category_id }}</p>
      </div>
    </div>
  </div>
