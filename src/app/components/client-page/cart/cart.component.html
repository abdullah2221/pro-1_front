<div class="cart-container">
  <!-- Back Button -->
  <button class="back-button" (click)="goBack()">← Back</button>

  <h2>Your Shopping Cart</h2>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="loading">
    <p>Loading cart items...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error">
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Cart Items -->
  <div *ngIf="cartItems.length > 0; else emptyCart">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems">
          <td class="product-info">
            <img src="https://images.unsplash.com/photo-1596460107916-430662021049?w=100&h=100&fit=crop" 
                 alt="{{ item.product_name }}" class="product-image">
            <span>{{ item.product_name }}</span>
          </td>
          <td>${{ item.product_price }}</td>
          <td class="quantity-control">
            <button (click)="updateQuantity(item.product_id, item.quantity - 1)" [disabled]="item.quantity <= 1">-</button>
            {{ item.quantity }}
            <button (click)="updateQuantity(item.product_id, item.quantity + 1)">+</button>
          </td>
          <td>${{ item.product_price * item.quantity }}</td>
          <td>
            <button (click)="removeFromCart(item.product_id)" class="remove-btn">Remove</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Total Price -->
    <div class="cart-total">
      <h3>Total: ${{ totalPrice }}</h3>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Empty Cart Message -->
  <ng-template #emptyCart>
    <p class="empty-cart">Your cart is empty. <br> Start adding products now! 😊</p>
  </ng-template>
</div>
