<div class="container">
  <h2>Product Management</h2>

  <!-- Show Add Product form for both Super Admin and Simple Admin -->
  <div *ngIf="isSuperAdmin || isSimpleAdmin" class="add-product-form">
    <h3>Add New Product</h3>

    <form [formGroup]="productForm" (ngSubmit)="addProduct()">
      <div class="form-group">
        <label for="name">Product Name</label>
        <input id="name" type="text" formControlName="name" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" required></textarea>
      </div>

      <div class="form-group">
        <label for="category_id">Category</label>
        <input id="category_id" type="number" formControlName="category_id" required />
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input id="price" type="number" step="0.01" formControlName="price" required />
      </div>

      <button type="submit" [disabled]="productForm.invalid" class="btn btn-primary">
        Add Product
      </button>
    </form>
  </div>

  

 
</div>
